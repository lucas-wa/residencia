name: v3_colqwen25
# ColQwen2.5 -- baseline atualizado da linha ColPali (late interaction, MaxSim),
# carregado pelo colpali-engine.
# Classe: `ColQwen2_5` + `ColQwen2_5_Processor` do colpali-engine (existem desde a
# 0.3.9; a faixa do requirements-slurm.txt e >=0.3.10). NAO ha fallback para `ColQwen2`
# -- arquiteturas distintas (qwen2_5_vl vs qwen2_vl), ver
# `benchmark/models/colvision.py: resolve_classes`.
# TODO confirmar em runtime: a tag exata do checkpoint (`vidore/colqwen2.5-v0.2`; ha
# tambem v0.1).
model_id: vidore/colqwen2.5-v0.2
model_kind: colqwen2.5
# TODO confirmar em runtime: nomes dos subconjuntos/colunas do ViDoRe V3.
dataset: vidore/vidore_v3_hr
dtype: bfloat16
# ~3B, bem mais leve que o trio 8B.
batch_size: 4
device: cuda
k_values: [1, 5, 10]
seed: 42
